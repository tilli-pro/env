[package]
name = "env-cli"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "with-env"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
git2 = "0.19"
dirs = "5.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
crypto_box = { version = "0.9", features = ["serde", "std"] }
blake2 = "0.10"
rand = "0.8"
keyring = "3.6.3"
rpassword = "7.4.0"
regex = "1.12.2"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.23.0"
