[package]
name = "env-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "with-env"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
git2 = "0.19"
dirs = "5.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sodiumoxide = "0.2.7"
