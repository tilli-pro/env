# Example GitHub Actions workflow for managing secrets with with-env
# Place this in .github/workflows/ to use it

name: Manage GitHub Secrets

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      environment:
        description: 'Target environment (production, staging, etc.)'
        required: true
        default: 'production'
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - list-envs
          - list-secrets
          - sync-secrets

jobs:
  manage-secrets:
    name: Manage Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with-env
        run: cargo build --release

      - name: Install with-env
        run: |
          sudo cp target/release/with-env /usr/local/bin/
          chmod +x /usr/local/bin/with-env

      - name: Initialize with-env
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          with-env init --org ${{ github.repository_owner }}

      - name: List environments
        if: github.event.inputs.action == 'list-envs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          with-env --repo ${{ github.repository }} list-envs

      - name: List secrets in environment
        if: github.event.inputs.action == 'list-secrets'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          with-env --repo ${{ github.repository }} list-secrets ${{ github.event.inputs.environment }}

      - name: Sync secrets to GitHub Environment
        if: github.event.inputs.action == 'sync-secrets'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add your secrets here from repository secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"

          # Set each secret (only if they exist in repository secrets)
          [ -n "$DATABASE_URL" ] && echo "$DATABASE_URL" | with-env set-secret "$ENV_NAME" DATABASE_URL || true
          [ -n "$API_KEY" ] && echo "$API_KEY" | with-env set-secret "$ENV_NAME" API_KEY || true
          [ -n "$STRIPE_SECRET" ] && echo "$STRIPE_SECRET" | with-env set-secret "$ENV_NAME" STRIPE_SECRET || true

          echo "✅ Secrets synced to $ENV_NAME environment"

# Example: Automated secret rotation
  rotate-secrets:
    name: Rotate Secrets (Example)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'  # Only run on schedule

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and install with-env
        run: |
          cargo build --release
          sudo cp target/release/with-env /usr/local/bin/

      - name: Initialize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: with-env init --org ${{ github.repository_owner }}

      - name: Generate new API key (example)
        id: generate
        run: |
          # Example: Generate a new random API key
          NEW_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$NEW_KEY"
          echo "new_key=$NEW_KEY" >> $GITHUB_OUTPUT

      - name: Update secret in GitHub Environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ steps.generate.outputs.new_key }}" | \
            with-env set-secret production API_KEY

      - name: Notify rotation complete
        run: |
          echo "✅ API_KEY rotated successfully in production environment"
          # Here you could send a notification to Slack, email, etc.
